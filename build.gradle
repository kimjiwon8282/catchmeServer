plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 1. 필수 스타터들
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web' // <-- 얘가 MVC 역할 다 함

	// 2. 롬복 (Lombok)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 3. DB 관련 (H2)
//	runtimeOnly 'com.h2database:h2' // <-- 얘만 있으면 됨 (h2console 불필요)
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 4. 테스트 관련
	testImplementation 'org.springframework.boot:spring-boot-starter-test' // (이름 수정됨: data-jpa-test 등은 starter-test에 포함되거나 필요시 추가)
	testImplementation 'org.springframework.security:spring-security-test' // (이름 수정됨)

	// *참고: 테스트 의존성이 너무 복잡하게 쪼개져 있어서, 보통은 아래처럼 뭉뚱그려 씁니다.
	// 기존 코드 그대로 두셔도 되지만, 에러나면 'org.springframework.boot:spring-boot-starter-test' 하나로 퉁치세요.

	// 5. JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// 6. AWS S3
	implementation platform("software.amazon.awssdk:bom:2.25.65")
	implementation "software.amazon.awssdk:s3"

	// 7. FCM (Firebase Cloud Messaging)
	implementation 'com.google.firebase:firebase-admin:9.2.0'

	// 7. Resilience4j (Spring Boot 3 전용)
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.1.0'

	// 8. AOP (어노테이션 동작을 위해 필수)
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// 9. 로컬 캐싱 (Caffeine)
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	//10.Redis 의존성 추가
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// 11. [추가] Spring Cloud AWS SQS 라이브러리 추가
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs:3.1.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
