spring:
  datasource:
    url: jdbc:h2:mem:catchme-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: ap-northeast-2
      sqs:
        endpoint: http://localhost:4566

jwt:
  issuer: catchme-test
  secret-key: 12345678901234567890123456789012

aws:
  s3:
    bucket: test-bucket
  region: ap-northeast-2

kakao:
  rest-api-key: test

ai:
  fastapi:
    url: http://localhost:8000
